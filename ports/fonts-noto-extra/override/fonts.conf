<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fonts-noto-extra: the fontconfig configuration of the Noto fonts for the
     scripts fonts-jamos does not cover (docs/G2-PLAN.md, "GP2 notes,
     continued"). fonts-jamos's fonts.conf includes this file after its own
     rules, so the fonts here come after fonts-jamos's in every generic family
     and stand in only for the characters those do not have. Read alone
     (FONTCONFIG_FILE pointing here) it names the directory and the rules, but
     the generic families have nothing of fonts-jamos's to go before: that is a
     test's choice and not a configuration. -->
<fontconfig>
  <dir>/pkg/share/fonts/noto-extra</dir>

  <!-- Where the families go in a pattern's list: at the end, after what
       fonts-jamos put there (its Noto Sans and Liberation, the generic names)
       and before the Noto Color Emoji it puts last of all, in the order the
       rules run: the scripts, Symbols and Math, Symbols 2 (the largest set)
       last of them, then the CJK faces. Serif and monospace text in these
       scripts has no serif or monospace face here: the sans one is the
       closest. -->
  <match target="pattern">
    <edit name="family" mode="append_last" binding="strong">
      <string>Noto Sans Arabic</string>
      <string>Noto Sans Hebrew</string>
      <string>Noto Sans Devanagari</string>
      <string>Noto Sans Bengali</string>
      <string>Noto Sans Tamil</string>
      <string>Noto Sans Telugu</string>
      <string>Noto Sans Gujarati</string>
      <string>Noto Sans Gurmukhi</string>
      <string>Noto Sans Kannada</string>
      <string>Noto Sans Malayalam</string>
      <string>Noto Sans Thai</string>
      <string>Noto Sans Georgian</string>
      <string>Noto Sans Armenian</string>
      <string>Noto Sans Ethiopic</string>
      <string>Noto Sans Khmer</string>
      <string>Noto Sans Lao</string>
      <string>Noto Sans Myanmar</string>
      <string>Noto Sans Sinhala</string>
      <string>Noto Sans Oriya</string>
      <string>Noto Sans Symbols</string>
      <string>Noto Sans Math</string>
      <string>Noto Sans Symbols 2</string>
    </edit>
  </match>

  <!-- CJK: the one set of Han characters is drawn five ways, so which face
       stands in depends on the language of the text. Chromium asks for a
       fallback font with the page's lang (what the author wrote: "ja",
       "zh-CN", "zh-Hant-TW", "ko") and no family, so the rules are on the
       pattern's lang and add the face at the end (after the scripts, in the
       order the rules run); the face added first is the first CJK face the
       sorted list reaches. A lang "contains" what it
       names (fontconfig compares language sets: a bare "zh" contains every
       zh-XX), so the order of the rules matters: for a bare "zh" the
       Simplified face comes first. The spellings: the region (CN, SG:
       Simplified; TW, MO: Traditional; HK) and the script (Hans, Hant). -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <edit name="family" mode="append_last" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="append_last" binding="strong"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <edit name="family" mode="append_last" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-sg</string></test>
    <edit name="family" mode="append_last" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hans</string></test>
    <edit name="family" mode="append_last" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="eq"><string>zh-hk</string></test>
    <edit name="family" mode="append_last" binding="strong"><string>Noto Sans CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <edit name="family" mode="append_last" binding="strong"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-mo</string></test>
    <edit name="family" mode="append_last" binding="strong"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hant</string></test>
    <edit name="family" mode="append_last" binding="strong"><string>Noto Sans CJK TC</string></edit>
  </match>

  <!-- With no language the Simplified Chinese face goes first (most Han text
       with no lang is Chinese), then the others in the collection's order;
       the rules above ran first, so they win where the language says. -->
  <match target="pattern">
    <edit name="family" mode="append_last" binding="strong">
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans CJK JP</string>
      <string>Noto Sans CJK KR</string>
      <string>Noto Sans CJK TC</string>
      <string>Noto Sans CJK HK</string>
    </edit>
  </match>

  <!-- The Google Fonts names of the same faces (a page's local() or a stack
       naming "Noto Sans JP") and the plain family name. -->
  <alias binding="same">
    <family>Noto Sans CJK</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>Noto Sans JP</family>
    <prefer><family>Noto Sans CJK JP</family></prefer>
  </alias>
  <alias binding="same">
    <family>Noto Sans KR</family>
    <prefer><family>Noto Sans CJK KR</family></prefer>
  </alias>
  <alias binding="same">
    <family>Noto Sans SC</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>Noto Sans TC</family>
    <prefer><family>Noto Sans CJK TC</family></prefer>
  </alias>
  <alias binding="same">
    <family>Noto Sans HK</family>
    <prefer><family>Noto Sans CJK HK</family></prefer>
  </alias>
</fontconfig>
