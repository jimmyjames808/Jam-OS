<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fonts-jamos: the fontconfig configuration of Jam OS (docs/G2-PLAN.md
     section 4). Every program's fontconfig finds it by default: libc serves
     /etc/fonts/fonts.conf (user/posix/sys/etc.c), the file fontconfig reads
     when FONTCONFIG_FILE is unset, and that file only includes this one. This
     file names the font directory, the aliases and the caches and includes
     the other font packages' files (fonts-noto-extra's), so a test that
     wants the full set sets FONTCONFIG_FILE to this file and one that wants
     fewer fonts sets it to its own.
     Everything this file names (directories, caches, includes) is under
     /pkg, which programs can only read (docs/SANDBOX-PLAN.md, SB1): a file
     or cache any program could write, on /data, would let it choose every
     other program's fonts, the browser's own included. So there is no file
     of the owner's own settings until one lives where only a settings grant
     writes. -->
<fontconfig>
  <!-- The fonts of this package (the fonts under it are found by walking
       the directory). /pkg is init's read-only view of where packages are
       installed (/jam/pkg on the Jam OS drive, else /data/pkg), so this is
       right on either; a program that reads it asks for `mount /pkg r`. -->
  <dir>/pkg/share/fonts/jamos</dir>

  <!-- The cache: only the packages' own, read only to every program. Not
       written yet (nothing on Jam OS writes the cache format of Chromium's
       fontconfig, docs/SANDBOX-PLAN.md, SB1 notes), so each program scans
       the fonts at its start and keeps what it found in memory. No cache a
       program can write: fontconfig takes the newest cache it finds for a
       directory and believes what it says (the faces, their names, their
       files), so a writable one, shared (/data) or a program's own
       (XDG_CACHE_HOME, HOME), is one that whatever else can write there
       fills (a browser's children write where the browser does). A program
       that wants a cache of its own sets FONTCONFIG_FILE to a file that
       includes this one and names it. -->
  <cachedir>/pkg/share/fonts/cache</cachedir>
  <!-- Where fontconfig writes the cache it made by a scan: nowhere. With no
       cache directory it can write it says "Fontconfig error: No writable
       cache directories" on stderr for each directory it scanned, at every
       start; /dev/null it takes as writable, and the write fails there
       quietly. Nothing is read from it (no file is under /dev/null). -->
  <cachedir>/dev/null</cachedir>

  <!-- A pattern with no generic family (Chromium's fallback search asks
       by language alone) gets sans-serif last, as fontconfig's own
       49-sansserif.conf does, so the lists below apply to it. -->
  <match target="pattern">
    <test qual="all" name="family" compare="not_eq"><string>sans-serif</string></test>
    <test qual="all" name="family" compare="not_eq"><string>serif</string></test>
    <test qual="all" name="family" compare="not_eq"><string>monospace</string></test>
    <edit name="family" mode="append_last"><string>sans-serif</string></edit>
  </match>

  <!-- The system UI font is the sans-serif one. Before the lists, so
       sans-serif, added here, is expanded by them. -->
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>sans-serif</family></prefer>
  </alias>

  <!-- The generic families (Noto Color Emoji comes last of all, below). -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Liberation Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Liberation Serif</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>Liberation Mono</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- The families pages ask for by name. Liberation's faces have the
       widths of the Microsoft ones, so a page laid out for Arial, Times
       New Roman or Courier New doesn't reflow. -->
  <alias binding="same">
    <family>Arial</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Helvetica</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Times New Roman</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>Times</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>Courier New</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>Courier</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>

  <!-- The fonts of the packages that come after this one (fonts-noto-extra:
       CJK and the other scripts), whose families go after this package's in
       the lists above. Not there: skipped. -->
  <include ignore_missing="yes">/pkg/share/fonts/noto-extra/fonts.conf</include>

  <!-- Noto Color Emoji last of all, after those packages' families too, so a
       page's emoji find a font whichever family it asked for and a character
       with a plain glyph in a text font (a snowman, a heart) is drawn with
       that. An emoji asked for as an emoji (Chromium's language for them,
       und-Zsye) finds this font first whatever the list says. -->
  <match target="pattern">
    <edit name="family" mode="append_last" binding="strong"><string>Noto Color Emoji</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>und-zsye</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Noto Color Emoji</string></edit>
  </match>
</fontconfig>
