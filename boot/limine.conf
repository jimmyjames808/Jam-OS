timeout: 3

/Jam OS
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline:

/All tests (objects, channels, ports, VMOs, locks, cancellation + M4 milestone)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: ktest

/Benchmark (about 10 s)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: bench

/Stress test (10 minutes)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: selftest stress=600

/Tests
//Self-test (memory + all CPUs)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: selftest

//Timer fallback (no TSC-deadline)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: nodeadline selftest

//Page fault (NULL write)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: testpf

//Write to kernel code (must fault)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: testro

//Write to kernel code through the HHDM alias (must fault)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: testrohhdm

//Stack overflow (guard page)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: teststack

//Lock order inversion (must be caught)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: testlockorder

//Two locks of one class nested (must be caught)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: testlocknest

//Lock used in and out of interrupts (must be caught)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: testlockirq

//Mutex order inversion (must be caught)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: testmutexorder

//Mutex taken holding a spinlock (must be caught)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: testmutexspin

//Stuck spinlock (must panic after 5 s)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: teststuck

//Watchdog (CPU stuck with interrupts off)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: testwatchdog

//Breakpoint (int3, must continue)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: testbp

//Panic
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: testpanic

//Show memory map
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: memmap
