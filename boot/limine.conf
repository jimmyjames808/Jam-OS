timeout: 3

/Jam OS
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline:

/Tests
//Self-test (memory)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: selftest

//Page fault (NULL write)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: testpf

//Write to kernel code (must fault)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: testro

//Stack overflow (guard page)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: teststack

//Panic
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: testpanic

//Show memory map
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: memmap
