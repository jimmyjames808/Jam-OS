timeout: 3

# The shell has the rest as commands (help): devices, pci, usb, ktest,
# utest, usbtest, bench, stress, demo, memmap, crash <name>. The Tests
# folder is what must run without a keyboard. Hidden boot words still work
# on a command line (tools/qemu-test.sh): pcilist, keytest, memmap,
# selftest, test<crash name> (testpf, ...), and smp=loader (Limine starts
# the other CPUs instead of the kernel: for troubleshooting, typed into an
# entry with Limine's editor, E).

# The kernel is loaded twice: the second copy, a module, is the pristine
# image the kernel stores for the next boot (docs/history/M8.5-PLAN.md). `reboot`
# and a panic both start that copy: a panic's boot saves its log as
# /data/logs/boot-NNNN-crash.txt and the shell says so in one line. Here
# and on the Tests entries alike. A panic halts with its screen up only
# without a stored kernel, or in a crash loop (a panic within 30 s of a
# start after a panic).
/Jam OS
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf

/Jam OS (text log, no splash)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: verbose

# The IOMMU (Intel VT-d) on: a device reaches only the memory its driver
# pinned and raises only the interrupts it was given (docs/M11-PLAN.md).
# A boot entry of its own while it is new (question 6); once the PC checks
# pass it becomes the default, and `iommu=off` (added with E) turns it off.
/Jam OS (IOMMU)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: iommu=on

/Jam OS (safe mode: no USB drivers, serial input only)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: nousb

/Jam OS (network: listen only)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: netprobe

/Jam OS (network: send test)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: netsend

/Jam OS (no network)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: vlan=off

# The build the stick had before the last `update -w` or `make flash`
# (both keep it as these two files; their names end the way the kernel
# finds its modules: bootfs.img, jamos.elf). A stick that has had neither
# has no such files: Limine then says it can't open them.
/Jam OS (previous build)
    protocol: limine
    path: boot():/boot/prev-jamos.elf
    module_path: boot():/boot/prev-bootfs.img
    module_path: boot():/boot/prev-jamos.elf

/Tests
//All tests (every kernel test)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: ktest

//Stress test (2 minutes, after each fix)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: selftest stress=120

//Stress test (10 minutes, milestone sign-off)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: selftest stress=600

//Soak test (3 minutes: shuffled tests under load; stops at a failure)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: soak=3

//Benchmark (about 10 s)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: bench

# The IOMMU's deliberate faults: a normal (shell) boot with the IOMMU on,
# where drv/hda points its command ring at an unpinned address and its
# response ring at the interrupt window on purpose (drivers/hda/vtdtest.c).
# Read the log for the "vtd: fault:" lines and drv/hda's "vtdtest:" lines
# (dmesg | grep -E 'vtd:|vtdtest'); the `iommu` shell command shows the
# units, domains and fault counts. Faults appear only once per-device
# domains are built (M11 D2); until then hda says it is on pass-through.
//IOMMU checks
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: iommu=on vtdtest

//Jam OS (init + utest + usbtest, the regression run)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: init

//Timer fallback (no TSC-deadline; self-test)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: nodeadline selftest
