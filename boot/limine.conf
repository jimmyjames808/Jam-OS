timeout: 3

/Jam OS
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline:

/M4 tests (objects, channels, ports, VMOs + milestone)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: ktest

/Stress test (10 minutes)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: selftest stress=600

/Tests
//Self-test (memory + all CPUs)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: selftest

//Timer fallback (no TSC-deadline)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: nodeadline selftest

//Page fault (NULL write)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: testpf

//Write to kernel code (must fault)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: testro

//Write to kernel code through the HHDM alias (must fault)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: testrohhdm

//Stack overflow (guard page)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: teststack

//Lock order inversion (must be caught)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: testlockorder

//Stuck spinlock (must panic after 5 s)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: teststuck

//Watchdog (CPU stuck with interrupts off)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: testwatchdog

//Breakpoint (int3, must continue)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: testbp

//Panic
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: testpanic

//Show memory map
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: memmap
