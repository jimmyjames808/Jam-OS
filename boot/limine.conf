timeout: 3

# The shell has the rest as commands (help): devices, pci, usb, ktest,
# utest, usbtest, bench, stress, demo, memmap, crash <name>. The Tests
# folder is what must run without a keyboard. Hidden boot words still work
# on a command line (tools/qemu-test.sh): pcilist, keytest, memmap,
# selftest, test<crash name> (testpf, ...).

# A panic halts with its screen up, here and on the Tests entries, so a
# failure can be read. The second entry restarts the PC by itself 15 s
# after a panic (panic_reboot=<seconds>; 0 or no word: it halts).
# The kernel is loaded twice: the second copy, a module, is the crash
# kernel's pristine image (docs/M8.5-PLAN.md). A panic starts it to save
# the log to /data/logs, then halts (or restarts, with panic_reboot).
/Jam OS
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf

/Jam OS (text log, no splash)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: verbose

/Jam OS (restart 15 s after a panic)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: panic_reboot=15

/Jam OS (safe mode: no USB drivers, serial input only)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: nousb

# The kernel starts the other CPUs itself (INIT-SIPI-SIPI). This entry has
# Limine start them instead, the way it was before: the fallback until the
# kernel's own startup is signed off on the PC.
/Jam OS (Limine starts the CPUs)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: smp=loader

/Tests
//All tests (every kernel test)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: ktest

//Stress test (2 minutes, after each fix)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: selftest stress=120

//Stress test (10 minutes, milestone sign-off)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: selftest stress=600

//Soak test (3 minutes: shuffled tests under load; halts on a failure)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: soak=3

//Benchmark (about 10 s)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: bench

//Jam OS (init + utest + usbtest, the regression run)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: init

//Timer fallback (no TSC-deadline; self-test)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: nodeadline selftest
