timeout: 3

# On top, the three ways to start Jam OS for everyday use; everything else
# (the tests, the network checks, the text log, safe mode, the IOMMU) is in
# the Developer folder (Enter opens it).
#
# The shell has the rest as commands (help dev): devices, pci, usb, ktest,
# utest, usbtest, bench, stress, memmap, crash <name>. The test entries are
# what must run without a keyboard. Hidden boot words still work on a
# command line (tools/qemu-test.sh): pcilist, keytest, memmap, selftest,
# test<crash name> (testpf, ...), and smp=loader (Limine starts the other
# CPUs instead of the kernel: for troubleshooting, typed into an entry with
# Limine's editor, E).

# The kernel is loaded twice: the second copy, a module, is the pristine
# image the kernel stores for the next boot (docs/history/M8.5-PLAN.md). `reboot`
# and a panic both start that copy: a panic's boot saves its log as
# /data/logs/boot-NNNN-crash.txt and the shell says so in one line. Here
# and on the Developer entries alike. A panic halts with its screen up only
# without a stored kernel, or in a crash loop (a panic within 30 s of a
# start after a panic).
/Jam OS
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf

# The build the stick had before the last `update -w` or `make flash`
# (both keep it as these two files; their names end the way the kernel
# finds its modules: bootfs.img, jamos.elf). A stick that has had neither
# has no such files: Limine then says it can't open them.
/Jam OS (previous build)
    protocol: limine
    path: boot():/boot/prev-jamos.elf
    module_path: boot():/boot/prev-bootfs.img
    module_path: boot():/boot/prev-jamos.elf

# No compositor (docs/G1-PLAN.md, question 4): the console draws the whole
# screen and takes the keys, one terminal, programs borrow the screen, as
# before G1. The way back if the compositor misbehaves on the PC; kept
# until G1 is signed off. A reboot keeps the word.
/Jam OS (no compositor)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: nocomp

/Developer
# The boot's log on the screen: the kernel's text log instead of the
# splash, and the log in the first terminal as it comes (every other boot
# keeps it in `dmesg`, /data/logs, the serial port and netlog).
//Jam OS (text log, no splash)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: verbose

# The IOMMU (Intel VT-d) is on by default (a device reaches only the memory
# its driver pinned and raises only the interrupts it was given:
# docs/M11-PLAN.md) since the PC's sign-off on 2026-10-07. This entry
# turns it off, the escape hatch if a device ever misbehaves with it.
//Jam OS (no IOMMU)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: iommu=off

//Jam OS (safe mode: no USB drivers, serial input only)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: nousb

//Jam OS (network: listen only)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: netprobe

//Jam OS (network: send test)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: netsend

//Jam OS (no network)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: vlan=off

//All tests (every kernel test)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: ktest

//Stress test (2 minutes, after each fix)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: selftest stress=120

//Stress test (10 minutes, milestone sign-off)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: selftest stress=600

//Soak test (3 minutes: shuffled tests under load; stops at a failure)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: soak=3

//Benchmark (about 10 s)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: bench

# The IOMMU's deliberate faults: a normal (shell) boot with the IOMMU on,
# where drv/hda points its command ring at an unpinned address and its
# response ring at the interrupt window on purpose (drivers/hda/vtdtest.c).
# Read the log for the "vtd: fault:" lines and drv/hda's "vtdtest:" lines
# (dmesg | grep -E 'vtd:|vtdtest'); the `iommu` shell command shows the
# units, domains and fault counts. If the controller could read the page
# anyway (no translation), hda says so and provokes nothing.
//IOMMU checks
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: iommu=on vtdtest

# The compositor alone on the screen with its test scene (G1): overlapping
# windows in the desktop's look, a move and a raise, then a full-screen
# window, about 4 s each; the RESULTS box then has its "compositor: bench:"
# paint times and "comptest: the compositor exited with code 0".
//Compositor test scene
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: comptest

//Jam OS (init + utest + usbtest, the regression run)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: init

//Timer fallback (no TSC-deadline; self-test)
    protocol: limine
    path: boot():/boot/jamos.elf
    module_path: boot():/boot/bootfs.img
    module_path: boot():/boot/jamos.elf
    cmdline: nodeadline selftest
