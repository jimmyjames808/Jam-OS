timeout: 3

/Jam OS
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline:

/Stress test (10 minutes)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: selftest stress=600

/Tests
//Self-test (memory + all CPUs)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: selftest

//Timer fallback (no TSC-deadline)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: nodeadline selftest

//Page fault (NULL write)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: testpf

//Write to kernel code (must fault)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: testro

//Stack overflow (guard page)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: teststack

//Lock order inversion (must be caught)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: testlockorder

//Watchdog (CPU stuck with interrupts off)
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: testwatchdog

//Panic
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: testpanic

//Show memory map
    protocol: limine
    path: boot():/boot/jamos.elf
    cmdline: memmap
