# init.cfg: the programs init starts, in order, one per line:
#     <path in bootfs> [arguments...]
# Blank lines and lines starting with '#' are ignored.
bin/utest
bin/usbtest
bin/posixtest

# The same run in parts, one boot each, all at once (tools/init-test.sh):
#     part <k> <path in bootfs> [arguments...]
# A boot with the kernel word initpart=<k> runs its part's lines alone; any
# other boot skips every part line. Together the parts run what the lines
# above run, every utest case once: `utest only` and `utest except` take
# comma-separated name prefixes, and the one `except` list is all the
# `only` lists (tools/init-test.sh checks this before it boots, and that
# the cases add up after). Split by time (about 40 s of each part's;
# new cases land in the except part). No `only` prefix may name nvmew_:
# those cases write drives when named. A case that counts the process's
# handles stays behind the cases that make a handle it would otherwise
# make first (jwlc_setup behind jwl_: `jwl` takes both).
part 1 bin/utest only comp_,logd_,hid_,supervised_
part 2 bin/utest only nettcp_,volumes_,con_,jwl,exec_
part 3 bin/utest except comp_,logd_,hid_,supervised_,nettcp_,volumes_,con_,jwl,exec_
part 3 bin/usbtest
part 3 bin/posixtest
